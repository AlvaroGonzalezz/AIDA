<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>AIDA — Tareas</title>
    <style>
        #screen-tasks {
            padding: 28px 24px 0;
        }

        .tasks-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .tasks-header .heading {
            margin-bottom: 0;
        }

        .task-composer {
            background: var(--violet-soft);
            border: 1px solid rgba(124, 58, 237, 0.08);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 18px;
        }

        .task-composer-head {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        .task-composer input {
            flex: 1;
            width: 100%;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--ink);
            outline: none;
        }

        .task-composer input:focus {
            border-color: var(--violet);
        }

        .composer-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            border: none;
            border-radius: 12px;
            padding: 11px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add {
            background: var(--grad);
            color: #fff;
        }

        .btn-more {
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ink);
        }

        .task-list-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 110px;
        }

        .task-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 14px 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .task-item .check-box {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1.5px solid var(--line);
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            cursor: pointer;
            transition: all .2s ease;
            flex-shrink: 0;
        }

        .task-item.done .check-box {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        .task-item.done .task-copy {
            text-decoration: line-through;
            color: var(--muted);
        }

        .task-copy {
            flex: 1;
            min-width: 0;
        }

        .task-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            color: var(--muted);
            font-size: 11.5px;
        }

        .tag {
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--bg);
            padding: 4px 7px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag.warning {
            border-color: rgba(245, 165, 36, 0.2);
            background: rgba(245, 165, 36, 0.08);
            color: #9a6700;
        }

        .tag.success {
            border-color: rgba(34, 176, 125, 0.2);
            background: rgba(34, 176, 125, 0.08);
            color: var(--green);
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 18px 10px;
            border: 1px dashed var(--line);
            border-radius: 16px;
            background: var(--bg);
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            padding: 12px 8px 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 8px;
            font-size: 10.5px;
            color: var(--muted-2);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--violet);
            font-weight: 600;
        }

        .nav-item .ic {
            font-size: 19px;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(27, 21, 51, 0.35);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 10;
        }

        .modal-overlay[hidden] {
            display: none;
        }

        .modal-panel {
            width: 100%;
            max-width: 100%;
            max-height: min(78vh, 680px);
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 28px;
            animation: sheetUp .25s ease;
            overflow-y: auto;
            box-sizing: border-box;
            position: relative;
        }

        @keyframes sheetUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-handle {
            width: 36px;
            height: 4px;
            background: var(--line);
            border-radius: 4px;
            margin: 0 auto 18px;
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--line);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
            font-family: 'Space Grotesk', sans-serif;
            top: 22px;
            z-index: 2;
            background: var(--surface);
            padding-top: 4px;
        }

        .tiny-field {
            margin-bottom: 14px;
        }

        .tiny-field label {
            display: block;
            margin-bottom: 7px;
            font-size: 12.5px;
            color: var(--muted);
            font-weight: 600;
        }

        .tiny-field input,
        .tiny-field textarea {
            width: 100%;
            border: 1px solid var(--line);
            background: var(--bg);
            border-radius: 12px;
            padding: 11px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--ink);
            outline: none;
        }

        .tiny-field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .tiny-field input:focus,
        .tiny-field textarea:focus {
            border-color: var(--violet);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-actions .btn {
            width: 100%;
        }

        @media (min-width: 750px) {
            .modal-overlay {
                align-items: center;
                padding: 24px;
            }

            .modal-panel {
                width: min(520px, 100%);
                max-height: min(76vh, 680px);
                border-radius: 24px;
                padding: 22px 22px 26px;
                overflow-y: auto;
            }

            .modal-handle {
                top: 0;
            }

            .modal-title {
                top: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="phone">
        <section class="screen" id="screen-tasks">
            <div class="top-back" onclick="window.location.href='index.html'"><i class="bi bi-arrow-left"></i></div>

            <div class="tasks-header">
                <div>
                    <div class="section-label">Ser organizado es clave para ser productivo</div>
                    <div class="heading">Tareas</div>
                </div>
                <button class="btn btn-ghost" style="width:auto; padding: 10px 12px;" onclick="openTaskModal()">+ Añadir</button>
            </div>

            <div class="task-composer">
                <div class="task-composer-head">
                    <i class="bi bi-pencil-square" style="font-size: 18px; color: var(--violet);"></i>
                    <div style="font-size:13px; color: var(--muted); font-weight:600;">Añadir tarea rápida</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <input id="quickTaskInput" type="text" placeholder="Se especificó, por ejemplo: Tengo un examen de programación el viernes...">
                    <button class="btn-small btn-add" type="button" onclick="addQuickTask()">Añadir</button>
                </div>
            </div>

            <div class="section-label">LISTA DE TAREAS</div>
            <div id="taskList" class="task-list-box">
                <div class="task-item">
                    <div class="check-box" onclick="toggleTask(this)"><i class="bi bi-check"></i></div>
                    <div class="task-copy">
                        <div class="task-text">Tengo un examen de programación el viernes</div>
                        <div class="task-meta">
                            <span class="tag warning"><i class="bi bi-calendar3"></i>Viernes</span>
                            <span class="tag"><i class="bi bi-clock"></i>1h 30m</span>
                        </div>
                    </div>
                </div>

                <div class="task-item">
                    <div class="check-box" onclick="toggleTask(this)"><i class="bi bi-check"></i></div>
                    <div class="task-copy">
                        <div class="task-text">Necesito revisar el desktop de ABC hoy a las 9:00 AM</div>
                        <div class="task-meta">
                            <span class="tag warning"><i class="bi bi-calendar3"></i>Hoy</span>
                            <span class="tag"><i class="bi bi-clock"></i>09:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-nav">
                <div class="nav-item" onclick="window.location.href='index.html'">
                    <div class="ic">🏠</div>Mi Día
                </div>
                <div class="nav-item" onclick="window.location.href='urgente.html'">
                    <div class="ic">📥</div>Urgente
                </div>
                <div class="nav-item active">
                    <div class="ic">📋</div>Tareas
                </div>
                <div class="nav-item">
                    <div class="ic">📁</div>Proyectos
                </div>
                <div class="nav-item">
                    <div class="ic">⚙️</div>Ajustes
                </div>
            </div>

            <div class="modal-overlay" id="taskModal" hidden>
                <div class="modal-panel">
                    <div class="modal-handle"></div>
                    <div class="modal-title">Añadir tarea</div>

                    <div class="tiny-field">
                        <label for="taskTitle">Tarea</label>
                        <input id="taskTitle" type="text" placeholder="Ej. Tengo un examen de programación el viernes...">
                    </div>

                    <div class="tiny-field">
                        <label for="taskDate">Fecha</label>
                        <input id="taskDate" type="date">
                    </div>

                    <div class="tiny-field">
                        <label for="taskTime">Hora</label>
                        <input id="taskTime" type="time">
                    </div>

                    <div class="tiny-field">
                        <label for="taskDuration">Duración</label>
                        <input id="taskDuration" type="text" placeholder="Ej. 45 min, 1h 30m">
                    </div>

                    <div class="tiny-field">
                        <label for="taskNotes">Notas</label>
                        <textarea id="taskNotes" placeholder="Ej. Revisar temas de lógica, traer portátil y apuntes."></textarea>
                    </div>

                    <div class="modal-actions">
                        <button class="btn btn-ghost" type="button" onclick="closeTaskModal()">Cancelar</button>
                        <button class="btn btn-primary" type="button" onclick="saveTaskFromModal()">Guardar tarea</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        function addQuickTask() {
            const input = document.getElementById('quickTaskInput');
            const value = input.value.trim();
            if (!value) return;
            addTaskItem(value, '', '', '');
            input.value = '';
            input.focus();
        }

        function openTaskModal() {
            document.getElementById('taskModal').hidden = false;
        }

        function closeTaskModal() {
            document.getElementById('taskModal').hidden = true;
        }

        function saveTaskFromModal() {
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) return;

            const date = document.getElementById('taskDate').value;
            const time = document.getElementById('taskTime').value;
            const duration = document.getElementById('taskDuration').value.trim();
            const notes = document.getElementById('taskNotes').value.trim();

            addTaskItem(title, date, time, duration, notes);
            closeTaskModal();
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDate').value = '';
            document.getElementById('taskTime').value = '';
            document.getElementById('taskDuration').value = '';
            document.getElementById('taskNotes').value = '';
        }

        function addTaskItem(title, date, time, duration, notes) {
            const list = document.getElementById('taskList');
            const item = document.createElement('div');
            item.className = 'task-item';

            const check = document.createElement('div');
            check.className = 'check-box';
            check.innerHTML = '<i class="bi bi-check"></i>';
            check.onclick = () => toggleTask(check);

            const content = document.createElement('div');
            content.className = 'task-copy';

            const text = document.createElement('div');
            text.className = 'task-text';
            text.textContent = title;

            const meta = document.createElement('div');
            meta.className = 'task-meta';

            if (date) {
                const tag = document.createElement('span');
                tag.className = 'tag warning';
                const formattedDate = new Date(date + 'T00:00:00');
                tag.innerHTML = '<i class="bi bi-calendar3"></i>' + formattedDate.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
                meta.appendChild(tag);
            }

            if (time) {
                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.innerHTML = '<i class="bi bi-clock"></i>' + time;
                meta.appendChild(tag);
            }

            if (duration) {
                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.innerHTML = '<i class="bi bi-hourglass-split"></i>' + duration;
                meta.appendChild(tag);
            }

            if (notes) {
                const noteTag = document.createElement('span');
                noteTag.className = 'tag success';
                noteTag.innerHTML = '<i class="bi bi-sticky"></i>' + notes.substring(0, 28) + (notes.length > 28 ? '…' : '');
                meta.appendChild(noteTag);
            }

            content.appendChild(text);
            content.appendChild(meta);
            item.appendChild(check);
            item.appendChild(content);
            list.appendChild(item);
        }

        function toggleTask(checkEl) {
            const item = checkEl.closest('.task-item');
            item.classList.toggle('done');
        }
    </script>
</body>

</html>
