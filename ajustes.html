<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>AIDA - Ajustes</title>
</head>

<body>
    <div class="phone">
        <section class="screen" id="screen-settings">
            <div class="settings-header">
                <div class="settings-kicker">Tu espacio</div>
                <div class="settings-title">Ajustes</div>
                <div class="settings-subtitle">Personaliza tu perfil y la forma en que AIDA te acompaña.</div>
            </div>

            <section class="settings-section">
                <div class="section-heading"><i class="bi bi-person-circle"></i>Perfil</div>
                <div class="settings-panel">
                    <div class="profile-top">
                        <img class="profile-photo" id="profilePhoto" src="assets/img/icon.png" alt="Foto de perfil">
                        <div class="photo-copy">
                            <strong>Foto de perfil</strong>
                            <span>Elige una imagen que te represente.</span>
                            <label class="photo-button" for="photoInput"><i class="bi bi-camera"></i> Cambiar foto</label>
                            <input id="photoInput" type="file" accept="image/*" hidden onchange="previewPhoto(event)">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="setting-field full">
                            <label for="name">Nombre</label>
                            <input id="name" type="text" autocomplete="name">
                        </div>
                        <div class="setting-field full">
                            <label for="email">Correo electrónico</label>
                            <input id="email" type="email" autocomplete="email" readonly>
                        </div>
                        <div class="setting-field full">
                            <label for="password">Contraseña</label>
                            <div class="password-field">
                                <input id="password" type="password" value="aida-password" readonly>
                                <button class="password-toggle" type="button" title="Mostrar contraseña" onclick="togglePassword('password')"><i class="bi bi-eye"></i></button>
                            </div>
                            <div class="password-action">
                                <span>Última actualización: hoy</span>
                                <button class="change-password-button" type="button" onclick="toggleChangePassword()">Cambiar contraseña</button>
                            </div>
                            <div class="change-password-panel" id="changePasswordPanel">
                                <div class="setting-field">
                                    <label for="currentPassword">Contraseña actual</label>
                                    <input id="currentPassword" type="password" autocomplete="current-password">
                                </div>
                                <div class="setting-field password-change-field">
                                    <label for="newPassword">Nueva contraseña</label>
                                    <input id="newPassword" type="password" autocomplete="new-password">
                                </div>
                                <div class="setting-field password-change-field">
                                    <label for="confirmPassword">Repite la nueva contraseña</label>
                                    <input id="confirmPassword" type="password" autocomplete="new-password">
                                </div>
                                <button class="btn btn-primary password-change-submit" type="button" onclick="changePassword()">Actualizar contraseña</button>
                                <div class="password-change-status" id="passwordChangeStatus" aria-live="polite"></div>
                            </div>
                        </div>
                        <div class="setting-field">
                            <label for="age">Rango de edad</label>
                            <select id="age">
                                <option value="" selected>Selecciona...</option>
                                <option value="18 - 24">18 - 24</option>
                                <option value="25 - 34">25 - 34</option>
                                <option value="35 - 44">35 - 44</option>
                                <option value="45 - 54">45 - 54</option>
                                <option value="55+">55+</option>
                            </select>
                        </div>
                        <div class="setting-field">
                            <label for="occupation">Ocupación actual</label>
                            <select id="occupation">
                                <option value="" selected>Selecciona...</option>
                                <option>Estudiante</option>
                                <option>Empleado</option>
                                <option>Freelancer</option>
                                <option>Emprendedor</option>
                                <option>Busco empleo</option>
                            </select>
                        </div>
                        <div class="setting-field full">
                            <label for="occupationDetail">¿A qué te dedicas exactamente?</label>
                            <textarea id="occupationDetail" placeholder="Ej. Estudio Ingeniería en Sistemas o trabajo en soporte técnico."></textarea>
                        </div>
                        <div class="setting-field full">
                            <label for="scheduleType">Horario habitual</label>
                            <select id="scheduleType">
                                <option value="">Selecciona...</option>
                                <option value="fixed">Horario fijo</option>
                                <option value="variable">Horario variable</option>
                                <option value="flexible">Yo decido mi horario</option>
                            </select>
                        </div>
                        <div class="setting-field full">
                            <label for="organizationChallenge">¿Qué te cuesta organizar?</label>
                            <textarea id="organizationChallenge" placeholder="Cuéntanos cuál es tu principal reto."></textarea>
                        </div>
                        <div class="setting-field">
                            <label for="country">País</label>
                            <select id="country">
                                <option value="" selected>Selecciona...</option>
                                <option>España</option>
                                <option>México</option>
                                <option>Colombia</option>
                                <option>Argentina</option>
                                <option>Otro</option>
                            </select>
                        </div>
                        <div class="setting-field full">
                            <label for="more">Cuéntame más</label>
                            <textarea id="more" placeholder="Cuéntale a AIDA qué está pasando en tu vida..."></textarea>
                        </div>
                    </div>
                </div>
            </section>

            <section class="settings-section">
                <div class="section-heading"><i class="bi bi-robot"></i>AIDA</div>
                <div class="settings-panel">
                    <div class="setting-group">
                        <div class="setting-label">Personalidad de AIDA</div>
                        <div class="choice-row four" data-setting="personality">
                            <button class="choice selected" data-value="direct" type="button">Directa</button>
                            <button class="choice" data-value="friendly" type="button">Amigable</button>
                            <button class="choice" data-value="professional" type="button">Profesional</button>
                            <button class="choice" data-value="motivational" type="button">Motivadora</button>
                        </div>
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">Nivel de proactividad</div>
                        <div class="choice-row" data-setting="proactivity">
                            <button class="choice" data-value="low" type="button">Baja</button>
                            <button class="choice selected" data-value="medium" type="button">Media</button>
                            <button class="choice" data-value="high" type="button">Alta</button>
                        </div>
                    </div>
                </div>
            </section>

            <button class="btn btn-primary settings-save" type="button" onclick="saveSettings()">Guardar cambios</button>
            <div class="save-status" id="saveStatus" aria-live="polite"></div>

            <div class="bottom-nav">
                <div class="nav-item" onclick="window.location.href='index.html'"><div class="ic">🏠</div>Mi Día</div>
                <div class="nav-item" onclick="window.location.href='urgente.html'"><div class="ic">📥</div>Urgente</div>
                <div class="nav-item" onclick="window.location.href='tareas.html'"><div class="ic">📋</div>Tareas</div>
                <div class="nav-item" onclick="window.location.href='chat.html'"><div class="ic">🤖</div>Chat con AIDA</div>
                <div class="nav-item active"><div class="ic">⚙️</div>Ajustes</div>
            </div>
        </section>
    </div>

    <script type="module" src="/js/supabase-client.js"></script>
    <script>
        document.querySelectorAll('.choice-row').forEach(row => {
            row.addEventListener('click', event => {
                const choice = event.target.closest('.choice');
                if (!choice) return;
                row.querySelectorAll('.choice').forEach(item => item.classList.remove('selected'));
                choice.classList.add('selected');
            });
        });

        window.addEventListener('DOMContentLoaded', loadSettings);

        async function loadSettings() {
            const client = window.aidaSupabase;
            const status = document.getElementById('saveStatus');
            if (!client) {
                status.textContent = 'No se pudo conectar con Supabase.';
                status.classList.add('error');
                return;
            }

            try {
                const { data: { user }, error: userError } = await client.auth.getUser();
                if (userError) throw userError;
                if (!user) throw new Error('Inicia sesión para consultar tu perfil.');

                const { data: profile, error } = await client
                    .from('profiles')
                    .select('display_name, age_range, occupation, occupation_detail, schedule_type, organization_challenge, extra_context, country, assistant_personality, assistant_proactivity')
                    .eq('id', user.id)
                    .maybeSingle();
                if (error) throw error;

                const values = profile || {};
                document.getElementById('name').value = values.display_name || user.user_metadata?.display_name || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('age').value = values.age_range || '';
                document.getElementById('occupation').value = values.occupation || '';
                document.getElementById('occupationDetail').value = values.occupation_detail || '';
                document.getElementById('scheduleType').value = values.schedule_type || '';
                document.getElementById('organizationChallenge').value = values.organization_challenge || '';
                document.getElementById('country').value = values.country || '';
                document.getElementById('more').value = values.extra_context || '';

                for (const [setting, value] of [
                    ['personality', values.assistant_personality || 'direct'],
                    ['proactivity', values.assistant_proactivity || 'medium']
                ]) {
                    const row = document.querySelector(`[data-setting="${setting}"]`);
                    row.querySelectorAll('.choice').forEach(choice => {
                        choice.classList.toggle('selected', choice.dataset.value === value);
                    });
                }
                status.textContent = '';
                status.classList.remove('error');
            } catch (error) {
                status.textContent = error.message || 'No se pudo cargar tu perfil.';
                status.classList.add('error');
            }
        }

        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) document.getElementById('profilePhoto').src = URL.createObjectURL(file);
        }

        function togglePassword(inputId) {
            const password = document.getElementById(inputId);
            const icon = password.parentElement.querySelector('.password-toggle i');
            password.type = password.type === 'password' ? 'text' : 'password';
            icon.className = password.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
        }

        function toggleChangePassword() {
            document.getElementById('changePasswordPanel').classList.toggle('open');
        }

        function changePassword() {
            const current = document.getElementById('currentPassword').value;
            const next = document.getElementById('newPassword').value;
            const confirmation = document.getElementById('confirmPassword').value;
            const status = document.getElementById('passwordChangeStatus');
            status.className = 'password-change-status';

            if (!current || !next || !confirmation) {
                status.textContent = 'Completa todos los campos.';
                return;
            }
            if (next.length < 8) {
                status.textContent = 'La nueva contraseña debe tener al menos 8 caracteres.';
                return;
            }
            if (next !== confirmation) {
                status.textContent = 'Las contraseñas nuevas no coinciden.';
                return;
            }

            document.getElementById('password').value = next;
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            status.className = 'password-change-status success';
            status.textContent = 'Contraseña actualizada.';
        }

        async function saveSettings() {
            const client = window.aidaSupabase;
            const status = document.getElementById('saveStatus');
            const button = document.querySelector('.settings-save');
            const displayName = document.getElementById('name').value.trim();
            status.classList.remove('error');

            if (!client) {
                status.textContent = 'No se pudo conectar con Supabase.';
                status.classList.add('error');
                return;
            }
            if (!displayName) {
                status.textContent = 'Escribe tu nombre antes de guardar.';
                status.classList.add('error');
                return;
            }

            button.disabled = true;
            status.textContent = 'Guardando...';
            try {
                const { data: { user }, error: userError } = await client.auth.getUser();
                if (userError) throw userError;
                if (!user) throw new Error('Inicia sesión para guardar tu perfil.');

                const { error: metadataError } = await client.auth.updateUser({
                    data: { display_name: displayName }
                });
                if (metadataError) throw metadataError;

                const profile = {
                    display_name: displayName,
                    age_range: document.getElementById('age').value || null,
                    occupation: document.getElementById('occupation').value || null,
                    occupation_detail: document.getElementById('occupationDetail').value.trim() || null,
                    schedule_type: document.getElementById('scheduleType').value || null,
                    organization_challenge: document.getElementById('organizationChallenge').value.trim() || null,
                    extra_context: document.getElementById('more').value.trim() || null,
                    country: document.getElementById('country').value || null,
                    assistant_personality: document.querySelector('[data-setting="personality"] .selected').dataset.value,
                    assistant_proactivity: document.querySelector('[data-setting="proactivity"] .selected').dataset.value
                };
                const { error } = await client.from('profiles').update(profile).eq('id', user.id);
                if (error) throw error;

                status.textContent = 'Cambios guardados en tu perfil.';
                status.classList.remove('error');
            } catch (error) {
                status.textContent = error.message || 'No se pudieron guardar los cambios.';
                status.classList.add('error');
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>

</html>
